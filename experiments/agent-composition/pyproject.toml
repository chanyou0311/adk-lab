[project]
name = "adk-agent-composition"
version = "0.1.0"
description = "単一 LLM エージェント vs multi-agent 構成 (agent composition) を統制比較する実験ハーネス"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk==2.4.0",
    "duckdb>=1.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 生成スクリプト・タスク定義・レポート出力は日本語のデータ/プロンプト/Markdown 文字列が長くなる
# (折り返すと可読性が落ちる)。
"scripts/gen_fixtures.py" = ["E501"]
"eval/run_eval.py" = ["E501"]
"eval/report.py" = ["E501"]
"eval/tasks.py" = ["E501"]
